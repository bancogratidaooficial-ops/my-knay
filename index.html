<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY KNAY - 223 VIDEOS - ESCALA 5x1</title>
<style>
body{font-family:Arial;background:#000;color:#fff;padding:0;margin:0;padding-top:60px;padding-bottom:130px}
.topo{position:fixed;top:0;left:0;right:0;background:#ff0055;color:#fff;padding:12px;text-align:center;z-index:9999;font-weight:bold;font-size:18px}
.barra-chave{position:fixed;top:45px;left:0;right:0;background:#1F4E79;color:#fff;padding:8px 12px;z-index:9998;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.botoes-topo button{padding:5px 8px;border:none;border-radius:6px;font-weight:bold;font-size:11px}
.box{background:#fff;color:#000;border-radius:12px;padding:12px;max-width:1100px;margin:10px auto}
label{font-size:11px;font-weight:bold;color:#1F4E79;display:block;margin-top:6px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-top:3px}
button{padding:13px;border:0;border-radius:8px;color:#fff;font-weight:bold;margin:5px 0;cursor:pointer}
.v{background:#27ae60}.a{background:#1F4E79}.r{background:#c0392b}.o{background:#e67e22}.y{background:#f1c40f;color:#000}.p{background:#8e44ad}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:10px;background:#fff;color:#000}
th{background:#1F4E79;color:#fff;padding:6px} td{border:1px solid #ccc;padding:5px;text-align:center}
.T{background:#C6EFCE}.F{background:#FFC7CE;font-weight:bold}.FM{background:#d6eaf8;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:2px solid #1F4E79;border-radius:10px;padding:10px;background:#f8faff;margin:8px 0;color:#000}
.ok{background:#d4edda;padding:8px;border-radius:6px;color:#155724;font-size:12px;margin:6px 0;display:none}
.item-lista{background:#fff;border:1px solid #ccc;border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;color:#000}
.btn-excluir{background:#ff4444;color:#fff;border:none;border-radius:6px;padding:6px 10px}

/* BARRAS DE BAIXO IGUAL PRINT */
.barra-baixo{position:fixed;bottom:0;left:0;right:0;background:#111;padding:6px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.linha{display:flex;gap:6px;overflow-x:auto}
.linha button{white-space:nowrap;flex:1;padding:10px 8px;font-size:11px;border-radius:8px;font-weight:bold}
.btn-backup{background:#2d2d2d;color:#fff}.btn-rest{background:#2d2d2d;color:#fff}.btn-conv{background:#00c851;color:#fff}.btn-nome{background:#7b5cff;color:#fff}.btn-reset{background:#fff;color:#000}
.btn-varios{background:#00a8ff;color:#fff}.btn-link{background:#ff9f00;color:#fff}.btn-gravar{background:#ff2e8b;color:#fff}.btn-knay{background:#ff3b3b;color:#fff}

.pill{display:inline-flex;background:#222;color:#fff;padding:10px 14px;border-radius:20px;align-items:center;gap:10px;margin:10px}
.pill .abrir{background:#ffcc00;color:#000;border:none;padding:8px 14px;border-radius:12px;font-weight:bold}
.genero{background:#ffcc00;color:#000;border:none;padding:10px 18px;border-radius:12px;font-weight:bold;margin:10px auto;display:block}
</style></head><body>

<div class="topo">🅰️ MY KNAY 🔥 (223 vídeos)</div>
<div class="barra-chave">
  <span>🔑 ESCALA-5X1-PR-2026 <small id="statusChave"></small></span>
  <div class="botoes-topo">
    <button style="background:#00ccff" onclick="fazerBackup()">💾</button>
    <button style="background:#00ff88" onclick="document.getElementById('inputRest').click()">♻️</button>
    <button style="background:#ffcc00" onclick="buscarTubeMate()">🔍</button>
  </div>
</div>
<input type="file" id="inputRest" accept=".json" style="display:none" onchange="processarRestaurar(event)">

<div style="text-align:center;padding-top:10px">
  <div class="pill">MY KNAY (223) <button class="abrir" onclick="buscarTubeMate()">ABRIR</button> <button style="background:#333;color:#fff;border:none;border-radius:10px;padding:8px 12px" onclick="document.getElementById('areaBusca').scrollIntoView()">X</button></div>
  <button class="genero">+ GÊNERO</button>
</div>

<div class="box">
<div id="msg" class="ok"></div>

<div id="areaBusca" class="card" style="background:#ffe6e6;border-color:#ff0000">
<label style="color:#ff0000">🎬 BUSCAR NO TUBEMATE + BAIXAR</label>
<div class="row">
<button style="background:#ff0000" onclick="buscarTubeMate()">🔍 BUSCAR NO TUBE MATE</button>
<button class="a" onclick="abrirNoTubeMate()">📲 BAIXAR VÍDEO/FILME</button>
</div>
<input id="linkVideo" placeholder="Cole link do YouTube aqui e clica em BAIXAR">
<div class="row" style="margin-top:6px">
<input id="termoBusca" placeholder="Ex: filme dublado 2024">
<button class="y" onclick="buscarFilme()">🎬 BUSCAR FILME</button>
</div>
</div>

<div class="card" style="background:#fff3cd;border-color:#e67e22">
<label style="color:#e67e22">DEFINIR INICIO ESCALA (TRAVA PRA NÃO SUMIR)</label>
<div class="row"><div><label>Data inicio</label><input type="date" id="dataInicio" value="2026-10-01"></div><div><label>Quem folga?</label><select id="folgaInicial"><option value="0">Natal</option><option value="1">Kaue</option><option value="2">Mario</option><option value="3">Jose Marcos</option><option value="4">Folguista</option><option value="5">Todos</option></select></div></div>
<button class="y" onclick="definirEscala()">📌 DEFINIR E TRAVAR ESCALA</button>
</div>

<div class="card">
<label>NOME</label><input id="nome" placeholder="Ex: Jose Marcos">
<label>HORARIO</label><div class="row"><input type="time" id="hin" value="10:00"><input type="time" id="hout" value="18:20"></div>
<label>TIPO</label><select id="tipo"><option value="5x1">5x1 AUTOMATICO</option><option value="fixa">FOLGA FIXA</option><option value="encarregado">ENCARREGADO</option><option value="folguista">FOLGUISTA</option><option value="personal">PERSONALIZADA</option></select>
<div class="row"><div><label>INICIO FOLGA</label><select id="inicioFolga"><option value="0">06,12,18,24,30</option><option value="1">05,11,17,23,29</option><option value="2">04,10,16,22,28</option><option value="3">03,09,15,21,27</option><option value="4">02,08,14,20,26</option><option value="5">01,07,13,19,25,31</option></select></div><div><label>DIAS FOLGA MANUAL</label><input id="diasFolga" placeholder="5,12,19,26"></div></div>
<button class="v" onclick="add()">+ ADICIONAR</button>
</div>

<div class="row"><div><label>MES</label><select id="mes"><option value="9">SETEMBRO</option><option value="10" selected>OUTUBRO</option><option value="11">NOVEMBRO</option></select></div><div><label>ANO</label><select id="ano"><option>2026</option></select></div></div>
<button class="a" onclick="gerar()">GERAR ESCALA</button>
<div id="lista" style="background:#eee;padding:8px;border-radius:8px;margin:6px 0;font-size:12px;color:#000"></div>
<div style="overflow:auto"><table id="tab"></table></div>
</div>

<!-- BARRAS IGUAIS DO PRINT -->
<div class="barra-baixo">
  <div class="linha">
    <button class="btn-backup" onclick="fazerBackup()">💾 BACKUP</button>
    <button class="btn-rest" onclick="document.getElementById('inputRest').click()">♻️ RESTAURAR</button>
    <button class="btn-conv" onclick="convidar()">💌 CONVIDAR</button>
    <button class="btn-nome" onclick="editarNomes()">✏️ NOME</button>
    <button class="btn-reset" onclick="limparTudo()">🧹 RESET</button>
  </div>
  <div class="linha">
    <button class="btn-varios" onclick="exemplo()">📁 VÁRIOS</button>
    <button class="btn-link" onclick="compartilhar()">🔗 LINK</button>
    <button class="btn-gravar" onclick="salvarDefinitivo()">📼 GRAVAR</button>
    <button class="btn-knay" onclick="buscarTubeMate()">▶️ KNAY</button>
  </div>
</div>

<script>
var funcs=[];var escalaTravada=null;
const KEY_FUNCS='funcsEscala_v2'; const KEY_TRAVA='escalaTravada_v2'; const KEY_BKP='funcsEscala_bkp_v2';
function showMsg(txt){var m=document.getElementById('msg');m.style.display='block';m.innerHTML=txt;setTimeout(()=>{m.style.display='none'},4000);}

function buscarTubeMate(){let termo=document.getElementById('termoBusca').value || prompt('O que buscar no TubeMate/YouTube?'); if(!termo)return; document.getElementById('termoBusca').value=termo; window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(termo)}`,'_blank');}
function buscarFilme(){let termo=document.getElementById('termoBusca').value || 'filme'; window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(termo+' filme completo dublado')}`,'_blank');}
function abrirNoTubeMate(){let link=document.getElementById('linkVideo').value.trim() || prompt('Cole o link do YouTube:'); if(!link)return; document.getElementById('linkVideo').value=link; window.location.href=`intent:${link}#Intent;package=devian.tubemate.home;end`; setTimeout(()=>window.open(link,'_blank'),1500);}

function definirEscala(){var data=document.getElementById('dataInicio').value;var quem=document.getElementById('folgaInicial').value;escalaTravada={data:data,[STRIPPED] Travada em '+data;showMsg('✅ Travada!');salvarDefinitivo();gerar();}
function salvarDefinitivo(){localStorage.setItem(KEY_FUNCS,JSON.stringify(funcs));localStorage.setItem(KEY_BKP,JSON.stringify(funcs));localStorage.setItem('funcsEscala',JSON.stringify(funcs));if(escalaTravada)localStorage.setItem(KEY_TRAVA,JSON.stringify(escalaTravada));showMsg('✅ GRAVADO! Não some mais.');}
function editarNomes(){let n=prompt('Renomear lista? Formato: Natal,Kaue,Mario'); if(!n)return; let arr=n.split(','); for(let i=0;i<arr.length && i<funcs.length;i++) funcs[i].nome=arr[i].trim(); lista();gerar();salvarDefinitivo();}
function add(){var nome=document.getElementById('nome').value.trim();if(!nome){alert('Digite nome');return}var hor=document.getElementById('hin').value+'-'+document.getElementById('hout').value;var tipo=document.getElementById('tipo').value;var inicio=parseInt(document.getElementById('inicioFolga').value)||0;var diasFolga=document.getElementById('diasFolga').value;funcs.push({nome,hor,tipo,inicio,diasFolga});document.getElementById('nome').value='';lista();gerar();salvarDefinitivo();}
function lista(){var d=document.getElementById('lista');if(funcs.length==0){d.innerHTML='Nenhum funcionario';return}var t='';for(var i=0;i<funcs.length;i++){t+=`<div class="item-lista"><span>${i+1}. <b>${funcs[i].nome}</b> ${funcs[i].hor}</span><button class="btn-excluir" onclick="rem(${i})">🗑️</button></div>`}d.innerHTML=t;if(escalaTravada)document.getElementById('statusChave').innerText='✅ '+escalaTravada.data;}
function rem(i){if(confirm('Remover 🗑️?')){funcs.splice(i,1);lista();gerar();salvarDefinitivo();}}
function limparTudo(){if(confirm('RESETAR TUDO?')){funcs=[];escalaTravada=null;localStorage.clear();lista();gerar();document.getElementById('statusChave').innerText='';}}
function exemplo(){funcs=[{nome:'Natal',hor:'15:20-22:40',tipo:'5x1',inicio:0},{nome:'Kaue',hor:'07:00-15:20',tipo:'5x1',inicio:1},{nome:'Mario',hor:'22:40-07:00',tipo:'5x1',inicio:2},{nome:'Jose Marcos',hor:'10:00-18:20',tipo:'5x1',inicio:3},{nome:'FOLGUISTA',hor:'22:40-07:00',tipo:'folguista',inicio:2},{nome:'Celio',hor:'11:00-19:40',tipo:'encarregado',inicio:0}];if(!localStorage.getItem(KEY_TRAVA)){escalaTravada={data:document.getElementById('dataInicio').value,[STRIPPED]
function gerar(){var mes=parseInt(document.getElementById('mes').value);var ano=parseInt(document.getElementById('ano').value);var dias=new Date(ano,mes,0).getDate();var tab=document.getElementById('tab');if(funcs.length==0){tab.innerHTML='<tr><td>Adicione</td></tr>';return}var dsem=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];var h='<tr><th>Nome</th><th>Hor</th><th>Tipo</th>';for(var d=1;d<=dias;d++){var dt=new Date(ano,mes-1,d);h+='<th>'+d+'<br>'+dsem[dt.getDay()]+'</th>';}h+='</tr>';for(var i=0;i<funcs.length;i++){var f=funcs[i];var ini=f.inicio||0;h+='<tr><td><b>'+f.nome+'</b></td><td>'+f.hor+'</td><td>'+f.tipo+'</td>';for(var d=1;d<=dias;d++){if(f.tipo=='encarregado'){var wd=new Date(ano,mes-1,d).getDay();h+=(wd==0||wd==6)?"<td class='F'>F</td>":"<td class='T'>T</td>";}else if(f.tipo=='personal'){var ld=f.diasFolga.split(',').map(s=>parseInt(s.trim()));h+=ld.includes(d)?"<td class='F'>F</td>":"<td class='T'>T</td>";}else if(f.tipo=='folguista'){h+=(d+ini)%6==0?"<td class='FM'>T</td>":"<td style=background:#eee>-</td>";}else{h+=(d+ini)%6==0?"<td class='F'>F</td>":"<td class='T'>T</td>";}}h+='</tr>';}tab.innerHTML=h;}
function fazerBackup(){var dados={escalaTravada,funcionarios:funcs};var blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='backup_escala_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function processarRestaurar(e){var arq=e.target.files[0];if(!arq)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);funcs=d.funcionarios||[];escalaTravada=d.escalaTravada;if(escalaTravada)localStorage.setItem(KEY_TRAVA,JSON.stringify(escalaTravada));salvarDefinitivo();lista();gerar();showMsg('♻️ Restaurado!');}catch{alert('Inválido');}};r.readAsText(arq);}
function compartilhar(){var txt=`📅 Escala 5x1 ${funcs.length} pessoas\n`+funcs.map(f=>`👤 ${f.nome}`).join('\n');if(navigator.share)navigator.share({title:'Escala',text:txt});else{navigator.clipboard.writeText(txt);alert('Link copiado');}}
function convidar(){navigator.clipboard.writeText(location.href).then(()=>alert('👥 Link copiado! '+location.href));}
window.onload=function(){var s=localStorage.getItem(KEY_FUNCS)||localStorage.getItem('funcsEscala');var t=localStorage.getItem(KEY_TRAVA)||localStorage.getItem('escalaTravada');if(s)funcs=JSON.parse(s);if(t){escalaTravada=JSON.parse(t);document.getElementById('dataInicio').value=escalaTravada.data;document.getElementById('statusChave').innerText='✅ '+escalaTravada.data;}lista();if(funcs.length>0)gerar();}
</script></body></html>
