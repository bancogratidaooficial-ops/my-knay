<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Knay - Efeitos Kwai</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-myknay.png">
<link rel="apple-touch-icon" href="icone-myknay.png">
<meta name="theme-color" content="#ff3d00">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh;width:100vw}
#videoWrap{position:relative;width:100vw;height:100vh;overflow:hidden;background:#111}
video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
#canvas{pointer-events:none}
.top{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;padding:12px;background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent)}
.logo{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:18px}
.logo img{width:36px;height:36px;border-radius:8px;background:#fff;padding:2px}
.btn-top{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:8px 12px;border-radius:20px;backdrop-filter:blur(10px)}
.efeitos{position:absolute;bottom:110px;left:0;right:0;z-index:10;display:flex;gap:10px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.efeitos::-webkit-scrollbar{display:none}
.efeito{min-width:62px;height:82px;background:rgba(255,255,255,0.15);border:2px solid transparent;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(10px);font-size:11px;text-align:center;cursor:pointer}
.efeito.ativo{border-color:#ff3d00;background:rgba(255,61,0,0.3)}
.efeito span{font-size:26px;margin-bottom:4px}
.controles{position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);padding:16px 20px 20px;display:flex;justify-content:space-around;align-items:center}
.btn-gravar{width:78px;height:78px;border-radius:50%;background:transparent;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.btn-gravar.gravando{border-color:#ff0000;animation:pulse 1s infinite}
.btn-gravar div{width:62px;height:62px;background:#ff0000;border-radius:50%;transition:0.2s}
.btn-gravar.gravando div{width:36px;height:36px;border-radius:8px;background:#ff0000}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.btn-lado{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:22px;backdrop-filter:blur(10px)}
.timer{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#ff0000;color:#fff;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:bold;z-index:10;display:none}
.galeria{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;z-index:100;height:60vh;border-radius:20px 20px 0 0;display:none;overflow:auto;padding:16px}
.galeria.show{display:block}
.vidItem{background:#1a1a1a;border-radius:12px;padding:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div id="videoWrap">
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<div class="timer" id="timer">00:00</div>
<div class="top">
<div class="logo"><img src="icone-myknay.png"> My Knay</div>
<button class="btn-top" onclick="trocarCamera()">🔄 Virar</button>
</div>
<div class="efeitos" id="listaEfeitos"></div>
<div class="controles">
<button class="btn-lado" onclick="abrirGaleria()">🖼️</button>
<div class="btn-gravar" id="btnGravar" onclick="gravar()"><div></div></div>
<button class="btn-lado" onclick="tirarFoto()">📸</button>
</div>
</div>
<div class="galeria" id="galeria">
<h3 style="color:#ff3d00;margin-bottom:12px">Meus Vídeos My Knay</h3>
<div id="listaVideos"><small style="color:#888">Nenhum vídeo ainda</small></div>
<br>
<button onclick="fecharGaleria()" style="width:100%;padding:12px;background:#ff3d00;border:none;border-radius:10px;color:#fff;font-weight:bold">FECHAR</button>
</div>
<script>
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let ctx=canvas.getContext('2d');
let stream=null;
let gravando=false;
let mediaRecorder=null;
let chunks=[];
let tempo=null;
let seg=0;
let facing='user';
let efeitoAtual='original';
const efeitosKwai=[
 {id:'original', nome:'Original', icon:'✨', filter:'none', emoji:''},
 {id:'beleza', nome:'Beleza', icon:'💖', filter:'brightness(1.18) contrast(1.08) saturate(1.12) blur(0.4px)', emoji:''},
 {id:'suave', nome:'Suave', icon:'🌸', filter:'brightness(1.1) contrast(0.95) saturate(0.9) blur(0.6px)', emoji:''},
 {id:'vintage', nome:'Vintage', icon:'📼', filter:'sepia(0.5) contrast(1.2) brightness(0.95) saturate(1.2)', emoji:''},
 {id:'cinema', nome:'Cinema', icon:'🎬', filter:'contrast(1.35) brightness(1.05) saturate(0.2)', emoji:''},
 {id:'quente', nome:'Quente', icon:'🔥', filter:'sepia(0.25) saturate(1.6) hue-rotate(-15deg) brightness(1.05)', emoji:''},
 {id:'frio', nome:'Frio', icon:'❄️', filter:'hue-rotate(180deg) saturate(0.8) brightness(1.1) contrast(1.1)', emoji:''},
 {id:'neon', nome:'Neon', icon:'🌈', filter:'hue-rotate(90deg) saturate(2) contrast(1.3)', emoji:''},
 {id:'dog', nome:'Dog', icon:'🐶', filter:'brightness(1.1) saturate(1.2)', emoji:'🐶'},
 {id:'coracao', nome:'Love', icon:'😍', filter:'brightness(1.15) saturate(1.3)', emoji:'😍'},
 {id:'oculos', nome:'Óculos', icon:'😎', filter:'contrast(1.1) brightness(1.1)', emoji:'😎'},
 {id:'choro', nome:'Choro', icon:'😭', filter:'saturate(1.3)', emoji:'😭'},
];
let dbVideos = JSON.parse(localStorage.getItem('myknay_videos')||'[]');
function montarEfeitos(){
 let div=document.getElementById('listaEfeitos');
 div.innerHTML='';
 efeitosKwai.forEach(e=>{
   div.innerHTML+=`<div class="efeito ${e.id===efeitoAtual?'ativo':''}" onclick="aplicarEfeito('${e.id}')"><span>${e.icon}</span>${e.nome}</div>`;
 });
}
function aplicarEfeito(id){
 efeitoAtual=id;
 let e=efeitosKwai.find(x=>x.id===id);
 video.style.filter=e.filter;
 montarEfeitos();
 if(e.emoji){ startEmoji(e.emoji); } else { stopEmoji(); }
}
let emojiInterval=null;
let emojiAtivo='';
function startEmoji(emo){
 stopEmoji();
 emojiAtivo=emo;
 emojiInterval=setInterval(()=>{
   ctx.clearRect(0,0,canvas.width,canvas.height);
   ctx.font='80px Arial';
   ctx.fillText(emo, 30, 120);
 },100);
}
function stopEmoji(){
 if(emojiInterval){clearInterval(emojiInterval);emojiInterval=null;}
 ctx.clearRect(0,0,canvas.width,canvas.height);
}
async function iniciarCamera(){
 if(stream){stream.getTracks().forEach(t=>t.stop());}
 try{
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:1280, height:720}, audio:true});
   video.srcObject=stream;
   await video.play();
   canvas.width=video.videoWidth||720;
   canvas.height=video.videoHeight||1280;
 }catch(err){alert('Permita a câmera: '+err.message);}
}
function trocarCamera(){
 facing=facing==='user'?'environment':'user';
 iniciarCamera();
}
function gravar(){
 if(!gravando){
   chunks=[];
   let mixedStream = new MediaStream([...stream.getVideoTracks(), stream.getAudioTracks()[0]]);
   let canvasGravar=document.createElement('canvas');
   let ctxG=canvasGravar.getContext('2d');
   canvasGravar.width=720;
   canvasGravar.height=1280;
   let filter = efeitosKwai.find(x=>x.id===efeitoAtual).filter;
   mediaRecorder = new MediaRecorder(mixedStream, {mimeType:'video/webm'});
   mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
   mediaRecorder.onstop=()=>{
     let blob=new Blob(chunks,{type:'video/webm'});
     let url=URL.createObjectURL(blob);
     salvarVideo(url, blob);
   };
   let desenhar=setInterval(()=>{
     if(!gravando){clearInterval(desenhar);return;}
     ctxG.filter=filter;
     ctxG.drawImage(video,0,0,canvasGravar.width,canvasGravar.height);
     if(emojiAtivo){
       ctxG.filter='none';
       ctxG.font='80px Arial';
       ctxG.fillText(emojiAtivo,30,120);
     }
   },33);
   mediaRecorder.start();
   gravando=true;
   document.getElementById('btnGravar').classList.add('gravando');
   document.getElementById('timer').style.display='block';
   seg=0;
   tempo=setInterval(()=>{seg++;let m=String(Math.floor(seg/60)).padStart(2,'0');let s=String(seg%60).padStart(2,'0');document.getElementById('timer').innerText=m+':'+s;},1000);
 } else {
   mediaRecorder.stop();
   gravando=false;
   document.getElementById('btnGravar').classList.remove('gravando');
   document.getElementById('timer').style.display='none';
   clearInterval(tempo);
 }
}
function salvarVideo(url, blob){
 let id=Date.now();
 dbVideos.unshift({id:id, data:new Date().toLocaleString(), duracao:seg});
 localStorage.setItem('myknay_videos', JSON.stringify(dbVideos));
 let a=document.createElement('a');
 a.href=url;
 a.download='myknay_'+id+'.webm';
 a.click();
 alert('Vídeo salvo! '+seg+'s com efeito '+efeitoAtual);
 renderGaleria();
}
function tirarFoto(){
 let c=document.createElement('canvas');
 c.width=video.videoWidth;
 c.height=video.videoHeight;
 let ct=c.getContext('2d');
 ct.filter=efeitosKwai.find(x=>x.id===efeitoAtual).filter;
 ct.drawImage(video,0,0);
 if(emojiAtivo){ct.filter='none';ct.font='80px Arial';ct.fillText(emojiAtivo,30,120);}
 let url=c.toDataURL('image/png');
 let a=document.createElement('a');
 a.href=url;
 a.download='myknay_foto_'+Date.now()+'.png';
 a.click();
}
function abrirGaleria(){document.getElementById('galeria').classList.add('show');renderGaleria();}
function fecharGaleria(){document.getElementById('galeria').classList.remove('show');}
function renderGaleria(){
 let div=document.getElementById('listaVideos');
 if(dbVideos.length===0){div.innerHTML='<small style="color:#888">Nenhum vídeo ainda. Grave com efeitos!</small>';return;}
 div.innerHTML='';
 dbVideos.forEach(v=>{
   div.innerHTML+=`<div class="vidItem"><span>📹 ${v.data} - ${v.duracao}s</span><button onclick="apagarVideo(${v.id})" style="background:#ff0000;border:none;color:#fff;padding:6px 10px;border-radius:8px">🗑️</button></div>`;
 });
}
function apagarVideo(id){if(confirm('Apagar?')){dbVideos=dbVideos.filter(v=>v.id!==id);localStorage.setItem('myknay_videos',JSON.stringify(dbVideos));renderGaleria();}}
montarEfeitos();
iniciarCamera();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
