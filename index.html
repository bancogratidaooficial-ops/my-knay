<!DOCTYPE html>
<html lang="pt-BR" class="notranslate" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY KNAY - Gratidão</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:115px}
.cabecalho{background:#ff0050;padding:14px;text-align:center;font-weight:900;font-size:18px}
.massa{background:#1c1c1c;border-radius:16px;margin:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.botao{border:none;padding:10px 14px;border-radius:10px;font-weight:900}
.botao-abrir{background:#ffcc00;color:#000}
.topo{background:#222;padding:10px;display:flex;justify-content:space-between;align-items:center}
.item{background:#1a1a1a;border-left:4px solid #ff0050;border-radius:12px;margin:10px 10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.barra{position:fixed;bottom:0;width:100%;background:#111;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:8px;z-index:50}
.barra2{position:fixed;bottom:56px;width:100%;background:#1a1a1a;display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:4px;padding:6px;z-index:50;border-top:1px solid #333}
.barra button,.barra2 button{padding:10px 2px;border:none;border-radius:8px;font-weight:900;font-size:11px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;padding:15px;overflow:auto}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;margin:6px 0}
#modalP{display:none;position:fixed;inset:0;z-index:200;background:#000}
#modalKwai{display:none;position:fixed;inset:0;z-index:210;background:#000}
#kwaiBox{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.kwaiItem{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.kwaiItem video{width:100%;height:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<div class="cabecalho">MY KNAY 🔥</div>
<div id="telaGeneros"></div><div id="telaFilmes" style="display:none"></div>
<div class="barra2">
<button onclick="backup()" style="background:#333;color:#fff">💾 BACKUP</button>
<button onclick="document.getElementById('inputRestore').click()" style="background:#333;color:#fff">♻️ RESTAURAR</button>
<button onclick="compartilhar()" style="background:#00c853;color:#fff">📤 CONVIDAR</button>
<button onclick="renomearApp()" style="background:#6c5ce7;color:#fff">✏️ NOME</button>
<button id="botaoReset" style="background:#fff;color:#000">🧹 RESET</button>
</div>
<div class="barra">
<button id="btnVarios" style="background:#00aaff;color:#fff">📂 VÁRIOS</button>
<button id="btnLink" style="background:#ff9800;color:#fff">🔗 LINK</button>
<button id="btnGravar" style="background:#e91e63;color:#fff">📹 GRAVAR</button>
<button id="btnKnay" style="background:#ff0050;color:#fff">▶️ KNAY</button>
</div>
<input type="file" id="arquivoMultiplo" accept="video/*" multiple style="display:none">
<input type="file" id="inputRestore" accept=".json" style="display:none">
<div id="modalLink" class="modal"><h2>🔗 Adicionar Link</h2><input id="linkUrl" class="input" placeholder="https://...mp4"><input id="linkNome" class="input" placeholder="Nome"><button onclick="addLink()" class="botao" style="background:#ff9800;width:100%">Salvar</button><button onclick="document.getElementById('modalLink').style.display='none'" class="botao" style="background:#333;color:#fff;width:100%;margin-top:6px">Fechar</button></div>
<div id="modalGravar" class="modal">
<h2>📹 Gravar</h2>
<div style="position:relative">
<video id="previewGravar" autoplay muted playsinline style="width:100%;height:65vh;background:#000;border-radius:16px;object-fit:cover"></video>
<button onclick="trocarCamera()" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:22px">🔄</button>
<div id="qualCamera" style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.6);color:#fff;padding:5px 10px;border-radius:10px;font-size:12px">Frontal</div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
<button id="btnStartRec" onclick="startRec()" style="background:#ff0050" class="botao">🔴 INICIAR</button>
<button id="btnStopRec" onclick="stopRec()" disabled style="background:#333;color:#888" class="botao">⏹️ PARAR</button>
</div>
<button onclick="fecharGravar()" class="botao" style="background:#333;color:#fff;width:100%;margin-top:8px">Fechar</button>
</div>
<div id="modalP"><button onclick="fecharPlayer()" style="position:fixed;top:10px;right:10px;z-index:101;background:#ffcc00;border:none;padding:10px;border-radius:8px">X</button><video id="v" controls autoplay playsinline style="width:100%;height:100%;background:#000"></video><div id="nomePlay" style="position:fixed;bottom:20px;left:10px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:10px"></div></div>
<div id="modalKwai"><button onclick="fecharKwai()" style="position:fixed;top:10px;left:10px;z-index:30;background:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:900">X FECHAR</button><div id="kwaiBox"></div></div>
<script>
let chaveFixa='plugtv_MY-KNAY_FINAL_UNICO';let dbFixa='PlugTV_MY-KNAY_FINAL_UNICO';let pastaAtual=0;let db=null;let dados;let jaAuto=false;let recorder=null;let chunks=[];let streamRec=null;let cameraAtual='user';
try{let atual=localStorage.getItem(chaveFixa);if(atual){dados=JSON.parse(atual);}else{let antiga=localStorage.getItem('plugtv_MEU-KWAI_FINAL_UNICO')||localStorage.getItem('plugtv_v7');if(antiga){dados=JSON.parse(antiga);localStorage.setItem(chaveFixa,antiga);}else{dados=[{nome:"MY KNAY",filmes:[]}];}}}catch(e){dados=[{nome:"MY KNAY",filmes:[]}];}
function salvar(){localStorage.setItem(chaveFixa,JSON.stringify(dados));let total=dados.reduce((s,g)=>s+g.filmes.length,0);document.querySelector('.cabecalho').innerText='MY KNAY 🔥 ('+total+' vídeos)';}
let req=indexedDB.open(dbFixa,1);req.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos'))e.target.result.createObjectStore('videos',{keyPath:'id'});};req.onsuccess=e=>{db=e.target.result;renderizar();};req.onerror=()=>renderizar();
function embaralhar(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderizar(){let h='';dados.forEach((g,i)=>{h+=`<div class="massa"><div><b>${g.nome}</b> <small>(${g.filmes.length})</small></div><div><button class="botao botao-abrir" onclick="abrir(${i})">ABRIR</button> <button onclick="removerGenero(${i})" style="background:#333;color:#fff" class="botao">X</button></div></div>`;});document.getElementById('telaGeneros').innerHTML='<div style="padding:12px">'+h+'</div><div style="text-align:center"><button onclick="criarGeneroPrompt()" style="background:#ffcc00;color:#000" class="botao">+ GÊNERO</button></div>';document.getElementById('telaGeneros').style.display='block';document.getElementById('telaFilmes').style.display='none';salvar();}
window.abrir=function(i){pastaAtual=i;let g=dados[i];let h=`<div class="topo"><button onclick="renderizar()" style="background:#333;color:#fff" class="botao">⬅ Voltar</button><b>${g.nome}</b><span>${g.filmes.length}</span></div>`;g.filmes.forEach((f,idx)=>{h+=`<div class="item"><b onclick="editarNome(${i},${idx})" style="flex:1;cursor:pointer">🎬 ${f.nome} ✏️</b><div style="display:flex;gap:4px"><button onclick="play(${i},${idx})" style="background:#ffcc00" class="botao">▶️</button><button onclick="excluirVideo(${i},${idx})" style="background:#333;color:#fff" class="botao">🗑️</button></div></div>`;});if(!g.filmes.length)h+=`<p style="text-align:center;color:#666;margin-top:30px">Vazio</p>`;document.getElementById('telaFilmes').innerHTML=h;document.getElementById('telaFilmes').style.display='block';document.getElementById('telaGeneros').style.display='none';}
window.play=function(gi,fi){let f=dados[gi].filmes[fi];document.getElementById('modalP').style.display='block';document.getElementById('nomePlay').innerText=f.nome;if(f.tipo=='link'){let v=document.getElementById('v');v.src=f.url;v.play();return;}let tx=db.transaction('videos','readonly');let r=tx.objectStore('videos').get(f.id);r.onsuccess=()=>{if(r.result){let v=document.getElementById('v');v.src=URL.createObjectURL(r.result.blob);v.play();}};}
window.fecharPlayer=function(){document.getElementById('modalP').style.display='none';let v=document.getElementById('v');v.pause();v.src='';}
window.excluirVideo=function(gi,fi){if(!confirm('Excluir?'))return;let f=dados[gi].filmes[fi];if(f.id&&f.tipo!='link'){try{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').delete(f.id);}catch(e){}}dados[gi].filmes.splice(fi,1);salvar();abrir(gi);}
window.editarNome=function(gi,fi){let n=prompt('Novo nome:',dados[gi].filmes[fi].nome);if(n){dados[gi].filmes[fi].nome=n;salvar();abrir(gi);}}
document.getElementById('btnVarios').onclick=()=>document.getElementById('arquivoMultiplo').click();
document.getElementById('arquivoMultiplo').onchange=async e=>{let files=[...e.target.files];for(let file of files){let id=Date.now()+'_'+Math.random();await new Promise(res=>{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').put({id,blob:file});tx.oncomplete=res;});dados[pastaAtual].filmes.push({id,nome:file.name,tipo:'file'});}salvar();abrir(pastaAtual);e.target.value='';}
document.getElementById('btnLink').onclick=()=>document.getElementById('modalLink').style.display='block';
window.addLink=function(){let url=document.getElementById('linkUrl').value.trim();let nome=document.getElementById('linkNome').value.trim()||'Link';if(!url)return;dados[pastaAtual].filmes.push({id:'link_'+Date.now(),nome,tipo:'link',url});salvar();document.getElementById('modalLink').style.display='none';abrir(pastaAtual);}
async function iniciarCamera(){if(streamRec)streamRec.getTracks().forEach(t=>t.stop());try{streamRec=await navigator.mediaDevices.getUserMedia({video:{facingMode:cameraAtual},audio:true});document.getElementById('previewGravar').srcObject=streamRec;document.getElementById('qualCamera').innerText=cameraAtual=='user'?'Frontal':'Traseira';}catch(err){alert('Erro: '+err.message);}}
window.trocarCamera=function(){cameraAtual=cameraAtual=='user'?'environment':'user';iniciarCamera();}
document.getElementById('btnGravar').onclick=async()=>{document.getElementById('modalGravar').style.display='block';cameraAtual='user';await iniciarCamera();};
window.fecharGravar=function(){document.getElementById('modalGravar').style.display='none';if(streamRec)streamRec.getTracks().forEach(t=>t.stop());}
window.startRec=function(){chunks=[];recorder=new MediaRecorder(streamRec);recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};recorder.onstop=async()=>{let blob=new Blob(chunks,{type:'video/webm'});let id=Date.now()+'_'+Math.random();await new Promise(res=>{let tx=db.transaction('videos','readwrite');tx.objectStore('videos').put({id,blob});tx.oncomplete=res;});let nome=prompt('Nome:','Gravado '+new Date().toLocaleTimeString())||'Gravado';dados[pastaAtual].filmes.push({id,nome,tipo:'file'});salvar();abrir(pastaAtual);fecharGravar();};recorder.start();document.getElementById('btnStartRec').disabled=true;document.getElementById('btnStopRec').disabled=false;document.getElementById('btnStopRec').style.background='#ff0050';document.getElementById('btnStopRec').style.color='#fff';}
window.stopRec=function(){if(recorder)recorder.stop();document.getElementById('btnStartRec').disabled=false;document.getElementById('btnStopRec').disabled=true;}
function criarGeneroPrompt(){let n=prompt('Nome da pasta:');if(n){dados.push({nome:n,filmes:[]});salvar();renderizar();}}
window.removerGenero=function(i){if(confirm('Apagar pasta?')){dados.splice(i,1);salvar();renderizar();}}
document.getElementById('botaoReset').onclick=()=>{if(confirm('RESETAR TUDO?')){localStorage.removeItem(chaveFixa);indexedDB.deleteDatabase(dbFixa);location.reload();}}
window.backup=function(){let blob=new Blob([JSON.stringify(dados)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup.json';a.click();}
document.getElementById('inputRestore').onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=ev=>{try{let imp=JSON.parse(ev.target.result);if(Array.isArray(imp)){dados=imp;salvar();renderizar();}}catch{}};r.readAsText(file);};
window.compartilhar=function(){let url=location.href;if(navigator.share)navigator.share({title:'MY KNAY',url});else prompt('Copia:',url);}
window.renomearApp=function(){let n=prompt('Nome:');if(n)document.querySelector('.cabecalho').innerText=n+' 🔥';}
window.fecharKwai=function(){document.getElementById('modalKwai').style.display='none';document.getElementById('kwaiBox').innerHTML='';}
document.getElementById('btnKnay').onclick=()=>{
let todos=[];dados.forEach((g,gi)=>{g.filmes.forEach((f,fi)=>{todos.push({obj:f});});});
if(!todos.length)return alert('Adicione vídeos');
todos=embaralhar(todos);
let h='';todos.forEach(t=>{let isLink=t.obj.tipo=='link';h+=`<div class="kwaiItem"><video ${isLink?'src="'+t.obj.url+'"':''} playsinline loop preload="metadata" data-id="${t.obj.id}" data-link="${isLink?'1':'0'}"></video><div style="position:absolute;bottom:90px;left:12px;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:12px"><b>${t.obj.nome}</b></div></div>`;});
document.getElementById('kwaiBox').innerHTML=h;document.getElementById('modalKwai').style.display='block';
let vids=document.querySelectorAll('#kwaiBox video');
vids.forEach((v,idx)=>{if(v.dataset.link=='0'){let tx=db.transaction('videos','readonly');let r=tx.objectStore('videos').get(v.dataset.id);r.onsuccess=()=>{if(r.result){v.src=URL.createObjectURL(r.result.blob);if(idx===0)v.play().catch(()=>{});}};}else{if(idx===0)v.play().catch(()=>{});}});
vids.forEach(v=>{v.addEventListener('play',()=>{vids.forEach(o=>{if(o!==v)o.pause();});});v.addEventListener('click',()=>{if(v.paused)v.play();else v.pause();});});
let observer=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){vids.forEach(x=>{if(x!==entry.target)x.pause();});entry.target.play().catch(()=>{});}else{entry.target.pause();}});},{threshold:0.6,root:document.getElementById('kwaiBox')});
vids.forEach(v=>observer.observe(v));
};
</script>
</body>
</html>
