<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MY KNAY 223 - FIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
.topo{position:fixed;top:0;left:0;right:0;background:#ff0055;padding:12px;text-align:center;z-index:100;font-weight:bold}
.chave{position:fixed;top:44px;left:0;right:0;background:#1F4E79;padding:6px 10px;z-index:100;display:flex;justify-content:space-between;font-size:12px;align-items:center}
.chave button{background:#00d4ff;color:#000;border:0;padding:6px 10px;border-radius:8px;font-weight:bold}
.feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;padding-top:76px;padding-bottom:130px}
.item{height:calc(100vh - 206px);scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center}
.item video{width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px}
.lateral{position:absolute;right:10px;bottom:20px;display:flex;flex-direction:column;gap:10px}
.lateral button{width:48px;height:48px;border-radius:50%;border:0;font-size:20px;background:rgba(255,255,255,.25);color:#fff}
.boxAdd{position:fixed;top:80px;left:10px;right:10px;background:#fff;color:#000;border-radius:12px;padding:12px;z-index:200;display:none;max-height:80vh;overflow:auto}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin-top:6px}
.bbaixo{position:fixed;bottom:0;left:0;right:0;background:#111;padding:6px;z-index:101;display:flex;flex-direction:column;gap:6px}
.linha{display:flex;gap:6px}.linha button{flex:1;padding:12px 4px;font-size:10px;border-radius:10px;border:0;font-weight:bold}
#cam{width:100%;border-radius:12px;display:none;margin-top:8px}
</style>
</head>
<body>
<div class="topo">A MY KNAY 🔥 (<span id="cont">0</span>) - DESLIZE PRA CIMA</div>
<div class="chave">
<span>🔑 KNAY-2026-FIXA ✅</span>
<button onclick="abrirAdd()">🔍 BUSCA TUBE MATE + YOUTUBE</button>
</div>

<div class="feed" id="feed"></div>

<div class="boxAdd" id="boxAdd">
<h3>🔍 BUSCA</h3>
<input id="termo" value="Comédia" placeholder="Digite: ação, comédia, etc">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<button style="background:#ff0000;color:#fff;padding:12px;border:0;border-radius:8px" onclick="buscarYT()">🔍 YOUTUBE</button>
<button style="background:#ff8800;color:#fff;padding:12px;border:0;border-radius:8px" onclick="buscarTM()">🔍 TUBE MATE</button>
</div>
<hr style="margin:10px 0">
<input id="linkAdd" placeholder="Cole link mp4"><button style="background:#1F4E79;color:#fff;width:100%;padding:12px;border:0;border-radius:8px;margin-top:6px" onclick="addLink()">+ ADD LINK</button>
<input type="file" id="files" accept="video/*" multiple style="margin-top:10px"><button style="background:#7b5cff;color:#fff;width:100%;padding:12px;border:0;border-radius:8px;margin-top:6px" onclick="addFiles()">📁 ADD VÁRIOS DO CELULAR</button>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">
<button style="background:#00a8ff;color:#fff;padding:10px;border:0;border-radius:8px" onclick="abrirCam('user')">🤳 FRONTAL</button>
<button style="background:#00a8ff;color:#fff;padding:10px;border:0;border-radius:8px" onclick="abrirCam('environment')">📷 TRASEIRA</button>
</div>
<video id="cam" autoplay muted playsinline></video>
<div id="gravBtns" style="display:none;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><button style="background:#ff3b3b;color:#fff;padding:12px;border:0;border-radius:8px" onclick="iniciarGrav()">🔴 GRAVAR</button><button style="background:#333;color:#fff;padding:12px;border:0;border-radius:8px" onclick="pararGrav()">⏹️ SALVAR NA GALERIA</button></div>
<button style="background:#000;color:#fff;width:100%;margin-top:10px;padding:10px;border-radius:8px;border:0" onclick="fecharAdd()">FECHAR</button>
<input type="file" id="rest" accept=".json" style="display:none" onchange="restaurar(event)">
</div>

<div class="bbaixo">
<div class="linha">
<button style="background:#2d2d2d;color:#fff" onclick="backup()">💾 BACKUP</button>
<button style="background:#2d2d2d;color:#fff" onclick="document.getElementById('rest').click()">♻️ RESTAURAR</button>
<button style="background:#00c851;color:#fff" onclick="convidar()">💌 CONVIDAR</button>
<button style="background:#fff;color:#000" onclick="resetar()">🧹 RESET</button>
</div>
<div class="linha">
<button style="background:#00a8ff;color:#fff" onclick="abrirAdd()">📁 VÁRIOS</button>
<button style="background:#ff9f00;color:#000" onclick="abrirAdd()">🔍 BUSCA</button>
<button style="background:#ff2e8b;color:#fff" onclick="abrirAdd()">📼 GRAVAR</button>
<button style="background:#ff3b3b;color:#fff" onclick="aleatorio()">▶️ KNAY</button>
</div>
</div>

<script>
let videos=JSON.parse(localStorage.getItem('knaY_tiktok')||'[]');
if(videos.length==0){videos=[{nome:'Teste - clique no vídeo pra rodar',url:'https://www.w3schools.com/html/mov_bbb.mp4'}]}
let stream=null,recorder=null,chunks=[];
function salvar(){localStorage.setItem('knaY_tiktok',JSON.stringify(videos.filter(v=>!v.url.startsWith('blob:'))));document.getElementById('cont').innerText=videos.length}
function render(){
  let feed=document.getElementById('feed');feed.innerHTML='';
  videos.forEach((v,i)=>{
    let div=document.createElement('div');div.className='item';
    div.innerHTML=`<video src="${v.url}" loop muted playsinline preload="auto" onclick="this.paused?this.play():this.pause()"></video><div class="overlay">${v.nome}</div><div class="lateral"><button onclick="curtir(this)">❤️</button><button onclick="shareUm(${i})">🔗</button><button onclick="rem(${i})">🗑️</button></div>`;
    feed.appendChild(div);
  });
  document.getElementById('cont').innerText=videos.length;
  const obs=new IntersectionObserver((ents)=>{ents.forEach(en=>{let vd=en.target.querySelector('video'); if(en.isIntersecting){vd.play().catch(()=>{});} else {vd.pause();}});},{threshold:0.6});
  document.querySelectorAll('.item').forEach(el=>obs.observe(el));
}
function addLink(){let l=document.getElementById('linkAdd').value.trim();if(!l)return;videos.unshift({nome:'Link '+(videos.length+1),url:l});salvar();render();fecharAdd();}
function addFiles(){let inp=document.getElementById('files');for(let f of inp.files){let u=URL.createObjectURL(f);videos.unshift({nome:f.name,url:u});}salvar();render();fecharAdd();}
function rem(i){if(confirm('Apagar?')){videos.splice(i,1);salvar();render();}}
function aleatorio(){let its=document.querySelectorAll('.item');if(its.length>0)its[Math.floor(Math.random()*its.length)].scrollIntoView({behavior:'smooth'});}
function buscarYT(){let t=document.getElementById('termo').value||'Comédia';window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(t),'_blank');}
function buscarTM(){let t=document.getElementById('termo').value||'Comédia';window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(t+' TubeMate'),' _blank');}
async function abrirCam(m){if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:m},audio:true});document.getElementById('cam').style.display='block';document.getElementById('cam').srcObject=stream;document.getElementById('gravBtns').style.display='grid';}catch{alert('Permita a câmera');}}
function iniciarGrav(){chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(chunks,{type:'video/mp4'});let url=URL.createObjectURL(blob);let nome='KNAY_'+Date.now()+'.mp4';videos.unshift({nome:nome,url:url});salvar();render();let a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();alert('Salvo na galeria: '+nome);};recorder.start();}
function pararGrav(){if(recorder)recorder.stop();if(stream)stream.getTracks().forEach(t=>t.stop());document.getElementById('cam').style.display='none';document.getElementById('gravBtns').style.display='none';}
function backup(){let blob=new Blob([JSON.stringify({videos:videos},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='myknay_backup.json';a.click();}
function restaurar(e){let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{let d=JSON.parse(ev.target.result);videos=d.videos||d;salvar();render();};r.readAsText(f);}
function resetar(){if(confirm('Apagar tudo?')){videos=[];localStorage.removeItem('knaY_tiktok');render();}}
function convidar(){navigator.clipboard.writeText(location.href).then(()=>alert('Convite copiado'))}
function shareUm(i){navigator.clipboard.writeText(videos[i].url).then(()=>alert('Link copiado'))}
function abrirAdd(){document.getElementById('boxAdd').style.display='block'}function fecharAdd(){document.getElementById('boxAdd').style.display='none'}function curtir(b){b.innerText=b.innerText=='❤️'?'💖':'❤️'}
window.onload=render;
</script>
</body>
</html>
