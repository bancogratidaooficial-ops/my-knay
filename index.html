<script>
let videos=[]; 
let videoAtual = null;
try{videos=JSON.parse(localStorage.getItem('knaY_FINAL')||'[]')}catch{videos=[]}
if(videos.length==0){videos=[{nome:'Toque pra som',url:'https://www.w3schools.com/html/mov_bbb.mp4'}]}

function salvar(){localStorage.setItem('knaY_FINAL',JSON.stringify(videos.filter(v=>!v.url.startsWith('blob:'))));document.getElementById('cont').innerText=videos.length}

function pausarTodosExceto(atual){
  document.querySelectorAll('video').forEach(v=>{
    if(v !== atual){ v.pause(); v.muted=true; }
  });
}

function ligarSom(vd){
  pausarTodosExceto(vd);
  vd.muted=false; vd.volume=1; vd.play();
  videoAtual = vd;
  document.querySelectorAll('.audio').forEach(b=>b.style.display='block');
  vd.parentElement.querySelector('.audio').style.display='none';
}

function render(){
  let feed=document.getElementById('feed');feed.innerHTML='';
  videos.forEach((v,i)=>{
    let d=document.createElement('div');d.className='item';
    d.innerHTML=`<video src="${v.url}" loop playsinline preload="metadata" id="vd${i}" onclick="ligarSom(this)"></video>
    <button class="audio" onclick="ligarSom(document.getElementById('vd${i}'))">🔊 TOQUE PRA SOM</button>
    <div class="overlay">${v.nome}</div>
    <div class="lateral"><button onclick="curtir(this)">❤️</button><button onclick="rem(${i})">🗑️</button></div>`;
    feed.appendChild(d);
  });

  // Só 1 por vez - observador
  const obs=new IntersectionObserver((ents)=>{
    ents.forEach(en=>{
      let vd=en.target.querySelector('video');
      if(en.isIntersecting){
        // Pausa todos os outros imediatamente
        pausarTodosExceto(vd);
        videoAtual = vd;
        // Se já liberou som antes, continua com som. Se não, mudo pra autoplay funcionar
        if(localStorage.getItem('somLiberado')=='sim'){
            vd.muted=false; vd.volume=1;
        }else{
            vd.muted=true;
        }
        vd.play().catch(()=>{});
      }else{
        if(vd===videoAtual) vd.pause();
      }
    });
  },{threshold:0.7});
  
  document.querySelectorAll('.item').forEach(el=>obs.observe(el));
  document.getElementById('cont').innerText=videos.length;
}

function ativarSom(){ 
  localStorage.setItem('somLiberado','sim');
  if(videoAtual){ videoAtual.muted=false; videoAtual.volume=1; videoAtual.play(); }
  document.querySelectorAll('.audio').forEach(b=>b.style.display='none');
}

// o resto continua igual
function mudaBrilho(v){document.getElementById('feed').style.filter=`brightness(${v}%) contrast(120%) saturate(130%)`; document.getElementById('valB').innerText=v+'%';}
function addFiles(inp){for(let f of inp.files){videos.unshift({nome:f.name,url:URL.createObjectURL(f)});}render();salvar();fecharAdd();}
function rem(i){if(confirm('Apagar?')){videos.splice(i,1);render();salvar();}}
function resetar(){if(confirm('Apagar tudo?')){videos=[];localStorage.removeItem('knaY_FINAL');render();}}
function abrirAdd(){document.getElementById('boxAdd').style.display='block'}function fecharAdd(){document.getElementById('boxAdd').style.display='none'}
function curtir(b){b.innerText=b.innerText=='❤️'?'💖':'❤️'}
function aleatorio(){let its=document.querySelectorAll('.item'); if(its.length) its[Math.floor(Math.random()*its.length)].scrollIntoView({behavior:'smooth'});}
window.onload=render;
</script>
